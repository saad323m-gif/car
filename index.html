<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-left">
            <img src="icon.png" alt="Logo" class="header-logo" id="header-logo" style="display: none;">
        </div>
        <div id="datetime" class="header-center"></div>
        <div class="header-right">
            <button id="refresh-btn" class="btn-refresh" title="Refresh Page" onclick="location.reload()" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
            </button>
            <button id="change-password-btn" class="btn-change-password" style="display: none;">Change Password</button>
            <button id="logout-btn" class="btn-logout" style="display: none;">Logout</button>
        </div>
    </header>

    <main>
        <div id="auth-view" class="view-container">
            <img src="icon.png" alt="Logo" class="logo-main" id="main-logo">
            <div id="form-container" class="form-box">
                <p class="loading-text">Loading system...</p>
            </div>
            <div id="message-box" class="message-box"></div>
        </div>

        <div id="dashboard-view" class="view-container" style="display: none;">
            <div class="tabs-nav">
                <button class="tab-btn active" data-tab="cars">Cars</button>
                <button class="tab-btn" data-tab="members">Members</button>
                <button class="tab-btn" data-tab="requests">Requests</button>
                <button class="tab-btn" data-tab="logs">Logs</button>
                <button class="tab-btn" data-tab="search">Search</button>
                <button class="tab-btn" data-tab="stats">Stats</button>
            </div>

            <div id="dashboard-container" class="dashboard-box">
                <p class="loading-text">Loading dashboard...</p>
            </div>
            <div id="dashboard-message-box" class="message-box"></div>
        </div>
    </main>

    <footer id="app-footer">
        <p>© <span id="copyright-year"></span> Car Management System — All Rights Reserved</p>
        <p class="footer-dev">Developed By MOHAMED SAAD</p>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
