<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Management</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#1b2a4a">
</head>
<body>

    <header>
        <div class="header-left">
            <img src="icon.png" alt="Logo" class="header-logo" id="header-logo" style="display: none;">
        </div>
        <div id="datetime" class="header-center"></div>
        <div class="header-right">
            <div class="language-switcher" aria-label="Language selector" data-no-translate>
                <button type="button" class="language-option active" data-language-option="en" aria-pressed="true">English</button>
                <button type="button" class="language-option" data-language-option="ar" aria-pressed="false">العربية</button>
            </div>
            <button id="refresh-btn" class="btn-refresh" title="Refresh Page" style="display: none;">↻</button>
            <button id="change-password-btn" class="btn-change-password" style="display: none;">Change Password</button>
            <button id="logout-btn" class="btn-logout" style="display: none;">Logout</button>
        </div>
    </header>

    <main>
        <div id="auth-view" class="view-container">
            <img src="icon.png" alt="Logo" class="logo-main" id="main-logo">
            <div id="form-container" class="form-box">
                <p class="loading-text">Loading system...</p>
            </div>
            <div id="message-box" class="message-box"></div>
        </div>

        <div id="dashboard-view" class="view-container" style="display: none;">
            <div class="tabs-nav">
                <button class="tab-btn active" data-tab="cars">Cars</button>
                <button class="tab-btn" data-tab="my-violations" id="my-violations-tab" style="display: none;">My Violations</button>
                <button class="tab-btn" data-tab="my-activity" id="my-activity-tab" style="display: none;">My Activity</button>
                <button class="tab-btn" data-tab="members">Members</button>
                <button class="tab-btn" data-tab="requests">
                    Requests
                    <span id="requests-badge" class="tab-badge" style="display: none;">0</span>
                </button>
                <button class="tab-btn" data-tab="logs">Logs</button>
                <button class="tab-btn" data-tab="search">Search</button>
                <button class="tab-btn" data-tab="stats">Stats</button>
                <button class="tab-btn" data-tab="violations">Violations</button>
            </div>

            <div id="dashboard-container" class="dashboard-box">
                <p class="loading-text">Loading dashboard...</p>
            </div>
            <div id="dashboard-message-box" class="message-box"></div>
        </div>
    </main>

    <footer id="app-footer">
        <p>© <span id="copyright-year"></span> Car Management System — All Rights Reserved</p>
        <p class="footer-dev">Developed By MOHAMED SAAD</p>
    </footer>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.log('SW registration failed: ', err));
            });
        }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
