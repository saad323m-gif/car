<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-left">
            <img src="icon.png" alt="Logo" class="header-logo" id="header-logo" style="display: none;">
        </div>
        <div id="datetime" class="header-center"></div>
        <div class="header-right">
            <button id="logout-btn" class="btn-logout" style="display: none;">Logout</button>
        </div>
    </header>

    <main>
        <div id="auth-view" class="view-container">
            <img src="icon.png" alt="Logo" class="logo-main" id="main-logo">
            <div id="form-container" class="form-box">
                <p class="loading-text">Loading system...</p>
            </div>
            <div id="message-box" class="message-box"></div>
        </div>

        <div id="dashboard-view" class="view-container" style="display: none;">
            <div class="tabs-nav">
                <button class="tab-btn active" data-tab="cars">Cars</button>
                <button class="tab-btn" data-tab="members">Members</button>
                <button class="tab-btn" data-tab="logs">Logs</button>
                <button class="tab-btn" data-tab="search" disabled>Search</button>
                <button class="tab-btn" data-tab="stats" disabled>Stats</button>
            </div>

            <div id="dashboard-container" class="dashboard-box">
                <p class="loading-text">Loading dashboard...</p>
            </div>
            <div id="dashboard-message-box" class="message-box"></div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
