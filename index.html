<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div id="datetime"></div>
        <button id="logout-btn" class="btn-logout" style="display: none;">Logout</button>
    </header>

    <main>
        <img src="icon.png" alt="Logo" class="logo">

        <!-- Auth View (Login / Setup) -->
        <div id="auth-view" class="view-container">
            <div id="form-container" class="form-box">
                <p class="loading-text">Loading system...</p>
            </div>
            <div id="message-box" class="message-box"></div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="view-container" style="display: none;">
            <div id="dashboard-container" class="dashboard-box">
                <p class="loading-text">Loading dashboard...</p>
            </div>
            <div id="dashboard-message-box" class="message-box"></div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
